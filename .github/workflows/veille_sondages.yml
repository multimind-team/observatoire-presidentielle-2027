name: Veille Automatique et Synchronisation des Données

on:
  # Déclenchement automatique hebdomadaire (chaque lundi à 08:00 UTC)
  schedule:
    - cron: '0 8 * * 1'
  
  # Déclenchement manuel à la demande depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action à effectuer'
        required: true
        default: 'sync_only'
        type: choice
        options:
          - sync_only
          - check_and_sync

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  veille-et-synchronisation:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécution du script de synchronisation
        run: |
          python scripts/sync_data.py

      - name: Détection et commit des modifications éventuelles
        run: |
          git config user.name "ObservatoireBot"
          git config user.email "bot@observatoire-presidentielle-2027.fr"
          git add -A
          if git diff --staged --quiet; then
            echo "Aucune modification détectée. Les pages sont déjà parfaitement à jour."
          else
            git commit -m "chore(data-sync): synchronisation automatique des sondages et données candidats"
            git push origin main
          fi
