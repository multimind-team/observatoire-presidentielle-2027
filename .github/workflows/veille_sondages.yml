name: Veille Hebdomadaire Sondages & Actualisation (Lundi 18h)

on:
  # Déclenchement automatique chaque lundi à 18h00 (Heure de Paris / 17:00 UTC)
  schedule:
    - cron: '0 17 * * 1'
  
  # Déclenchement manuel à la demande depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      forcer_actualisation:
        description: 'Forcer la synchronisation même sans nouveau sondage'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  veille-et-synchronisation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Exécution de la veille hebdomadaire
        run: |
          python scripts/veille_sondages_hebdo.py

      - name: 🔄 Synchronisation des données JSON vers les pages HTML
        run: |
          python scripts/sync_data.py

      - name: 🚀 Commit et Déploiement automatique si modifications
        run: |
          git config user.name "ObservatoireBot"
          git config user.email "bot@observatoire-presidentielle-2027.fr"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ Aucune modification détectée. Les pages sont déjà parfaitement synchronisées."
          else
            git commit -m "chore(veille-hebdo): veille automatique sondages du lundi 18h et synchronisation des données"
            git push origin main
            echo "🚀 Mises à jour publiées avec succès sur la branche main !"
          fi

      - name: 🌐 Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Téléversement de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Déploiement direct sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
